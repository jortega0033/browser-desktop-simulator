<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Desktop Workbench</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="bar">
  <h1>Workbench</h1>
  <p class="hint" id="shortcut-hint">Shortcuts: Ctrl+S or Cmd+S save, Alt+N new file, Up and Down move in the file list, Esc returns to the list.</p>
</header>
<main class="bench">
  <section class="panel" aria-labelledby="files-heading">
    <h2 id="files-heading">File list</h2>
    <div class="actions">
      <button type="button" id="new-file">New file</button>
      <button type="button" id="load-fixtures">Load example files</button>
    </div>
    <p id="empty-note" class="note" hidden>No files yet. Choose New file or Load example files.</p>
    <ul id="file-list" class="files"></ul>
  </section>
  <section class="panel" aria-labelledby="editor-heading">
    <h2 id="editor-heading">Text editor</h2>
    <div class="field">
      <label for="file-name">File name</label>
      <input id="file-name" type="text" maxlength="64" autocomplete="off" spellcheck="false" readonly>
    </div>
    <div class="field grow">
      <label for="file-text">File text</label>
      <textarea id="file-text" spellcheck="false" aria-describedby="file-meta dirty-flag"></textarea>
    </div>
    <div id="conflict" class="conflict" role="group" aria-label="Revision conflict" hidden>
      <p>This file changed on the server since you opened it. Your text is kept.</p>
      <div class="actions">
        <button type="button" id="load-latest">Load latest</button>
        <button type="button" id="keep-mine">Keep mine and save</button>
      </div>
    </div>
    <div class="actions foot">
      <button type="button" id="save" class="primary">Save</button>
      <span id="dirty-flag" class="dirty"></span>
    </div>
    <p id="file-meta" class="meta">No file open.</p>
    <div id="status" role="status" aria-live="polite" class="status"></div>
  </section>
</main>
</body>
</html>
